# Reverse-proxy /phpMyAdmin/ to the phpMyAdmin container so it is
# reachable through the same host/port as the main webserver, without
# exposing the phpMyAdmin (or MariaDB) container to the host.
RedirectMatch 301 ^/phpMyAdmin$ /phpMyAdmin/
<Location /phpMyAdmin/>
    ProxyPass http://phpmyadmin:80/
    ProxyPassReverse http://phpmyadmin:80/
</Location>
