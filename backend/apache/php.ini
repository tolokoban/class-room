; Files are uploaded as base64 data URLs inside a JSON body (see api/file.php),
; so the request is ~4/3 the size of the file and is held several times in memory.
post_max_size = 32M
memory_limit = 256M
; Otherwise, the warning about a too large request is printed before the headers,
; which prevents the session from starting (it is still in the logs).
display_startup_errors = Off
