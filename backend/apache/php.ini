; Files are uploaded by chunks of 1 MB, encoded in base64 inside a JSON body
; (see api/file.php and api/written.php): a request is ~4/3 the size of a chunk.
; The notes of a class room (file/notes-set) are still sent in a single request.
post_max_size = 32M
memory_limit = 256M
; Otherwise, the warning about a too large request is printed before the headers,
; which prevents the session from starting (it is still in the logs).
display_startup_errors = Off
